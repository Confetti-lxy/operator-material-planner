name: Update PRTS data

on:
  schedule:
    # GitHub scheduled events are best-effort, so use three off-peak Monday
    # windows. These are 09:17, 14:41 and 20:53 in Asia/Shanghai (UTC+8).
    - cron: "17 1 * * 1"
    - cron: "41 6 * * 1"
    - cron: "53 12 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: Reparse every PRTS page
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: prts-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-update.txt
      - name: Install image dependency
        run: python -m pip install -r requirements-update.txt
      - name: Regenerate and validate data
        run: python tools/update_prts_data.py ${{ inputs.full && '--full' || '' }}
      - name: Run site data audit
        run: python tools/audit_data.py --report data-audit-report.json
      - name: Upload update reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-update-report
          path: |
            data-update-report.json
            data-audit-report.json
      - name: Commit changed data
        id: commit
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data dist/assets/operators data-update-state.json
          git commit -m "chore(data): update from PRTS"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy updated site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
